<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InputOTP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body>
<div class="gr-stage">
  <div class="gr-field" style="width:auto">
    <span class="gr-label" id="otp-l">Verification code</span>
    <div class="gr-otp" role="group" aria-labelledby="otp-l">
      <div class="gr-otp-group"><span class="gr-otp-cell">4</span><span class="gr-otp-cell">8</span><span class="gr-otp-cell">1</span></div>
      <span class="gr-otp-sep"></span>
      <div class="gr-otp-group"><span class="gr-otp-cell" data-active></span><span class="gr-otp-cell"></span><span class="gr-otp-cell"></span></div>
    </div>
    <p class="gr-help" style="margin:0">Sent to the email on your account.</p>
  </div>
</div>
</body>
</html>
