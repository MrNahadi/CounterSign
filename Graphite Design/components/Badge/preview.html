<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body>
<div class="gr-stage">
  <div class="gr-row">
    <span class="gr-badge">Draft</span>
    <span class="gr-badge gr-badge-brand">Beta</span>
    <span class="gr-badge gr-badge-positive"><span class="gr-dot gr-dot-live"></span>Live</span>
    <span class="gr-badge gr-badge-warning"><span class="gr-dot"></span>Degraded</span>
    <span class="gr-badge gr-badge-danger"><span class="gr-dot"></span>Failed</span>
  </div>
  <div class="gr-row">
    <span class="gr-badge gr-badge-pill">12</span>
    <span class="gr-badge gr-badge-pill gr-badge-brand">New</span>
    <span class="gr-badge gr-badge-pill gr-badge-positive">Paid</span>
  </div>
</div>
</body>
</html>
