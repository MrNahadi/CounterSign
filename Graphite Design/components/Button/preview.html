<!-- @dsCard group="Actions" height=300 width=820 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body>
<div class="gr-stage">
  <div class="gr-label-meta">Variants</div>
  <div class="gr-row">
    <button class="gr-btn gr-btn-primary gr-btn-lg"><span>Deploy</span></button>
    <button class="gr-btn gr-btn-secondary gr-btn-lg"><span>Cancel</span></button>
    <button class="gr-btn gr-btn-tertiary gr-btn-lg"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg><span>Filter</span></button>
    <button class="gr-btn gr-btn-brand gr-btn-lg"><span>Upgrade</span></button>
    <button class="gr-btn gr-btn-danger gr-btn-lg"><span>Delete project</span></button>
    <button class="gr-btn gr-btn-danger-subtle gr-btn-lg"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg><span>Delete</span></button>
    <button class="gr-btn gr-btn-transparent gr-btn-lg gr-btn-icon" aria-label="More actions"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    <button class="gr-btn gr-btn-link"><span>View logs</span></button>
  </div>
  <div class="gr-label-meta">Sizes</div>
  <div class="gr-row">
    <button class="gr-btn gr-btn-primary gr-btn-xs"><span>Extra small</span></button>
    <button class="gr-btn gr-btn-primary gr-btn-sm"><span>Small</span></button>
    <button class="gr-btn gr-btn-primary gr-btn-md"><span>Medium</span></button>
    <button class="gr-btn gr-btn-primary gr-btn-lg"><span>Large</span></button>
    <button class="gr-btn gr-btn-primary gr-btn-xl"><span>Extra large</span></button>
  </div>
  <div class="gr-label-meta">Icons, shape and shortcut</div>
  <div class="gr-row">
    <button class="gr-btn gr-btn-secondary gr-btn-md"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>New project</span></button>
    <button class="gr-btn gr-btn-secondary gr-btn-md"><span>Continue</span><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <button class="gr-btn gr-btn-brand gr-btn-md gr-btn-pill"><span>Get started</span></button>
    <button class="gr-btn gr-btn-primary gr-btn-md"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Search</span><kbd class="gr-kbd">⌘K</kbd></button>
    <button class="gr-btn gr-btn-tertiary gr-btn-xl gr-btn-icon" aria-label="Add"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:20px"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  </div>
  <div class="gr-label-meta">Pending and disabled</div>
  <div class="gr-row">
    <button class="gr-btn gr-btn-primary gr-btn-md" aria-busy="true"><span class="gr-spinner" style="--size:14px"></span><span>Deploying</span></button>
    <button class="gr-btn gr-btn-primary gr-btn-md" disabled><span>Disabled primary</span></button>
    <button class="gr-btn gr-btn-secondary gr-btn-md" disabled><span>Disabled secondary</span></button>
    <button class="gr-btn gr-btn-brand gr-btn-md" disabled><span>Disabled brand</span></button>
  </div>
</div>
</body>
</html>
