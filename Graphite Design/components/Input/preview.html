<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Input</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body>
<div class="gr-stage">
  <div class="gr-row gr-row-lg">
    <div class="gr-field">
      <label class="gr-label" for="pn">Project name</label>
      <input class="gr-input" id="pn" placeholder="acme-web" value="graphite-web">
      <p class="gr-help" style="margin:0">Used in URLs and the CLI.</p>
    </div>
    <div class="gr-field">
      <label class="gr-label" for="q">Search</label>
      <span class="gr-input-wrap"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="gr-input" id="q" placeholder="Search projects"></span>
    </div>
  </div>
  <div class="gr-row gr-row-lg">
    <div class="gr-field">
      <label class="gr-label" for="dm">Domain</label>
      <input class="gr-input" id="dm" value="My_Site.com" aria-invalid="true" aria-describedby="dm-e">
      <p class="gr-help gr-help-error" id="dm-e" style="margin:0">Use lowercase letters, numbers and hyphens.</p>
    </div>
    <div class="gr-field">
      <label class="gr-label" for="rg">Region</label>
      <input class="gr-input" id="rg" value="Frankfurt" disabled>
      <p class="gr-help" style="margin:0">Region is set when a project is created.</p>
    </div>
  </div>
  <div class="gr-field" style="width:584px;max-width:100%">
    <label class="gr-label" for="ds">Description</label>
    <textarea class="gr-input" id="ds" rows="3" placeholder="What does this project do?"></textarea>
  </div>
</div>
</body>
</html>
