<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">

<body>
<div class="gr-stage">
  <table class="gr-table">
    <thead><tr><th>Status</th><th>Commit</th><th>Branch</th><th class="gr-num">Duration</th><th class="gr-num">Age</th><th style="width:40px"></th></tr></thead>
    <tbody>
      <tr><td><span class="gr-badge gr-badge-positive"><span class="gr-dot"></span>Ready</span></td><td><span class="gr-mono">a1f9c2e</span> Tighten card spacing</td><td>main</td><td class="gr-num">42s</td><td class="gr-num">4m</td><td><button class="gr-btn gr-btn-transparent gr-btn-sm gr-btn-icon" aria-label="Row actions"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:14px"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></td></tr>
      <tr><td><span class="gr-badge gr-badge-danger"><span class="gr-dot"></span>Failed</span></td><td><span class="gr-mono">7c03b11</span> Add billing page</td><td>billing</td><td class="gr-num">1m 08s</td><td class="gr-num">22m</td><td><button class="gr-btn gr-btn-transparent gr-btn-sm gr-btn-icon" aria-label="Row actions"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:14px"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></td></tr>
      <tr><td><span class="gr-badge"><span class="gr-dot"></span>Queued</span></td><td><span class="gr-mono">e88d4a0</span> Update dependencies</td><td>deps</td><td class="gr-num">Waiting</td><td class="gr-num">1h</td><td><button class="gr-btn gr-btn-transparent gr-btn-sm gr-btn-icon" aria-label="Row actions"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:14px"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
