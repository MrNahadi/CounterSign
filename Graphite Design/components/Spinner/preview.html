<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body>
<div class="gr-stage">
  <div class="gr-row" style="gap:20px">
    <span class="gr-spinner" role="status" aria-label="Loading" style="--size:12px"></span>
    <span class="gr-spinner" role="status" aria-label="Loading"></span>
    <span class="gr-spinner" role="status" aria-label="Loading" style="--size:20px;color:var(--color-brand-foreground)"></span>
    <span class="gr-row" style="gap:8px;color:var(--color-secondary-foreground)"><span class="gr-spinner" style="--size:14px"></span>Building<span class="gr-pixel" style="color:var(--color-primary-foreground)">00:42</span></span>
    <span class="gr-badge gr-badge-positive"><span class="gr-dot gr-dot-live"></span>Streaming logs</span>
  </div>
</div>
</body>
</html>
