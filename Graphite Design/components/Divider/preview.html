<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Divider</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body>
<div class="gr-stage">
  <div class="gr-card" style="width:360px;padding:0">
    <div style="padding:12px 16px">Members</div>
    <hr class="gr-divider gr-divider-subtle">
    <div style="padding:12px 16px">Billing</div>
    <hr class="gr-divider gr-divider-subtle">
    <div style="padding:12px 16px">Danger zone</div>
  </div>
  <div class="gr-row" style="gap:8px">
    <button class="gr-btn gr-btn-transparent gr-btn-sm gr-btn-icon" aria-label="Edit"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:14px"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></svg></button>
    <button class="gr-btn gr-btn-transparent gr-btn-sm gr-btn-icon" aria-label="Copy"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:14px"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    <span class="gr-divider-v" role="separator" aria-orientation="vertical"></span>
    <button class="gr-btn gr-btn-transparent gr-btn-sm gr-btn-icon" aria-label="Delete"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:14px"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
  </div>
</div>
</body>
</html>
