<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body class="gr-on-shell">
<div class="gr-stage">
  <div class="gr-row gr-row-lg" style="gap:16px">
    <div class="gr-card" style="width:260px">
      <div class="gr-card-title">graphite-web</div>
      <div class="gr-card-desc">Production · deployed 4m ago</div>
      <div class="gr-row" style="margin-top:16px"><span class="gr-badge gr-badge-positive"><span class="gr-dot gr-dot-live"></span>Live</span><span class="gr-badge">Next.js</span></div>
    </div>
    <div class="gr-card" style="width:260px;box-shadow:0 0 0 1px var(--color-brand-border-default)">
      <div class="gr-card-title">Pro plan</div>
      <div class="gr-card-desc">Selected · billed monthly</div>
      <div class="gr-card gr-card-tinted" style="margin-top:12px;padding:12px;border-radius:8px">Includes 10 projects and preview comments.</div>
    </div>
  </div>
</div>
</body>
</html>
