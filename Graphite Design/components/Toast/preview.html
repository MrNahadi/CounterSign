<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..700&amp;display=swap">
</head>
<body class="gr-on-shell">
<div class="gr-stage" style="align-items:flex-start">
  <div class="gr-toast gr-toast-positive" role="status"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><div class="gr-toast-body"><div class="gr-toast-title">Deployment ready</div><div class="gr-toast-desc">graphite-web is live on production.</div></div><button class="gr-btn gr-btn-transparent gr-btn-sm"><span>View</span></button></div>
  <div class="gr-toast gr-toast-danger" role="alert"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div class="gr-toast-body"><div class="gr-toast-title">Build failed</div><div class="gr-toast-desc">Type error in src/app.ts on line 42.</div></div><button class="gr-btn gr-btn-transparent gr-btn-sm gr-btn-icon" aria-label="Dismiss"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true" style="--icon:14px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="gr-toast gr-toast-info" role="status"><svg class="gr-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><div class="gr-toast-body"><div class="gr-toast-title">3 items archived</div></div><button class="gr-btn gr-btn-transparent gr-btn-sm"><span>Undo</span></button></div>
</div>
</body>
</html>
