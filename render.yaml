# Countersign's hosted demo on Render's free plan (ADR 0041, and the owner's decision of 8 Nov
# in DECISIONS.md). Sandbox only. No secret lives in this file: each one is typed into the
# dashboard (sync: false) or generated by Render. Postgres is Neon's free plan: DATABASE_URL is
# its connection string with sslmode=require, pasted on each service that needs it. Render's free
# plan has no private services, cron jobs or pre-deploy commands, so Resolve is a web service,
# the scheduled jobs run on GitHub Actions, and the gate migrates in its build. Free services
# can't reach each other privately, so they call each other's public https://...onrender.com URLs
# (GATE_URL, RESOLVE_AGENT_URL, typed in), and Resolve, now public, takes calls only with
# RESOLVE_SHARED_SECRET: generated on Resolve, copied by hand to the gate and the console. See
# docs/hosting.md.

services:
  - type: web
    name: countersign-gate
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run db:migrate
    startCommand: npm run start --workspace @countersign/gate
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SEED_VAULT_TOKEN
        sync: false
      - key: PAYPAL_SEED_VAULT_TOKEN_B
        sync: false
      - key: COUNTERSIGN_SUPPORT_AGENT_KEY
        generateValue: true
      - key: COUNTERSIGN_OPS_AGENT_KEY
        generateValue: true
      - key: COUNTERSIGN_APPROVER_KEY
        generateValue: true
      - key: COUNTERSIGN_DEMO_RESET
        value: "on"
      - key: RESOLVE_AGENT_URL
        sync: false
      - key: RESOLVE_SHARED_SECRET
        sync: false

  - type: web
    name: countersign-resolve-agent
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev
    startCommand: GATE_MCP_URL=${GATE_URL%/}/mcp npm run start --workspace @countersign/resolve-agent
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESOLVE_DAILY_RUN_CAP
        value: "200"
      - key: RESOLVE_BASELINE
        value: scenarios
      - key: COUNTERSIGN_SUPPORT_AGENT_KEY
        fromService:
          type: web
          name: countersign-gate
          envVarKey: COUNTERSIGN_SUPPORT_AGENT_KEY
      - key: RESOLVE_SHARED_SECRET
        generateValue: true
      - key: GATE_URL
        sync: false

  - type: web
    name: countersign-console
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build --workspace @countersign/console
    startCommand: npm run start --workspace @countersign/console -- -H 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: STOREFRONT_URL
        sync: false
      - key: CONSOLE_PUBLIC_URL
        sync: false
      - key: GATE_URL
        sync: false
      - key: RESOLVE_AGENT_URL
        sync: false
      - key: RESOLVE_SHARED_SECRET
        sync: false

  - type: web
    name: countersign-storefront
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build --workspace @countersign/storefront
    startCommand: npm run start --workspace @countersign/storefront -- -H 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
